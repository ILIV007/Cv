<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Lost in space | ILIV007</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6BA4D4;
            --primary-light: #8FC0E8;
            --accent: #9EC8E8;
            --bg: #0B1120;
            --text: #e8edf5;
            --text-muted: #aab4c5;
            --text-dim: #8b97ab;
            --border: rgba(148, 163, 184, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            overflow: hidden;
        }
        .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .star {
            position: absolute; width: 2px; height: 2px;
            background: var(--accent); border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.9; } }
        .content { position: relative; z-index: 1; max-width: 560px; }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(6rem, 18vw, 10rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fff, var(--primary-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }
        h1 { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 1.05rem; line-height: 1.7; margin-bottom: 32px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--primary), #4A7AA8);
            color: #fff; text-decoration: none; border-radius: 12px;
            font-weight: 600; font-size: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(110, 164, 212, 0.45); }
        @media (prefers-reduced-motion: reduce) { .star { animation: none; } }
    </style>
</head>
<body>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <div class="content">
        <div class="code">404</div>
        <h1>Lost in space</h1>
        <p>The page you're looking for drifted off into the cosmos. Let's get you back home.</p>
        <a href="/" class="btn"><span aria-hidden="true">🌀</span> Back to Earth</a>
    </div>
    <script>
        (function () {
            var s = document.getElementById('stars');
            for (var i = 0; i < 40; i++) {
                var star = document.createElement('span');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                s.appendChild(star);
            }
        })();
    </script>
</body>
</html>
