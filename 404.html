<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Lost in the Galaxy | ILIV007</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#05060d">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05060d;
            --primary: #6BA4D4;
            --primary-light: #8FC0E8;
            --accent: #9EC8E8;
            --violet: #a78bfa;
            --text: #e8edf5;
            --text-muted: #aab4c5;
            --text-dim: #8b97ab;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            position: relative;
        }
        #galaxy {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            z-index: 0; display: block;
        }
        .vignette {
            position: fixed; inset: 0; z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                transparent 0%, transparent 45%,
                rgba(5,6,13,0.55) 80%, rgba(5,6,13,0.92) 100%);
        }
        .content {
            position: fixed; inset: 0; z-index: 2;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 24px;
            pointer-events: none;
        }
        .content > * { pointer-events: auto; }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(7rem, 20vw, 12rem);
            font-weight: 900; line-height: 0.9;
            background: linear-gradient(135deg, #ffffff 0%, var(--primary-light) 45%, var(--violet) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -4px;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .title {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            font-weight: 800; color: var(--text);
            margin-bottom: 14px; letter-spacing: -0.5px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: clamp(1rem, 2.2vw, 1.15rem);
            line-height: 1.7; margin-bottom: 36px; max-width: 480px;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary), #4A7AA8);
            color: #fff; text-decoration: none;
            border-radius: 14px; font-weight: 700; font-size: 15px;
            letter-spacing: 0.3px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 8px 30px rgba(110, 164, 212, 0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(110, 164, 212, 0.5);
        }
        .btn:active { transform: translateY(-1px) scale(0.98); }
        .hint {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%); z-index: 2;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px; letter-spacing: 1.5px;
            text-transform: uppercase; opacity: 0.5;
            pointer-events: none;
        }
        *:focus-visible {
            outline: 2px solid var(--primary-light);
            outline-offset: 4px; border-radius: 6px;
        }
        @media (prefers-reduced-motion: reduce) {
            .code { animation: none; }
        }
    </style>
</head>
<body>
    <canvas id="galaxy" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="content">
        <div class="code">404</div>
        <h1 class="title">Lost in the galaxy</h1>
        <p class="subtitle">The page you're looking for drifted beyond the event horizon. Let's bring you back to known space.</p>
        <a href="/" class="btn"><span aria-hidden="true">🌀</span> Back to Earth</a>
    </div>

    <div class="hint">move your cursor · drift through the stars</div>

    <script src="js/galaxy.js"></script>
</body>
</html>
